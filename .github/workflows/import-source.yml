name: Import prepared source archive
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml
      - .staging/topium-usb-intro-v0.2.tar.xz.b64
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm source bundle exists
        id: check
        run: test -f .staging/topium-usb-intro-v0.2.tar.xz.b64
      - name: Unpack verified project snapshot
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          src = pathlib.Path(".staging/topium-usb-intro-v0.2.tar.xz.b64")
          compressed = base64.b64decode(src.read_text().strip(), validate=True)
          raw = lzma.decompress(compressed)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
              entries = archive.getmembers()
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.name)
                  if not entry.isfile() or not entry.name or path.is_absolute() or ".." in path.parts:
                      raise ValueError(f"Unsafe archive entry: {entry.name!r}")
              for entry in entries:
                  if entry.name.startswith(".github/workflows/"):
                      continue
                  target = pathlib.Path(entry.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(entry).read())
          print(f"Imported {len(entries)} source files")
          PY
      - name: Commit verified source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .staging/topium-usb-intro-v0.2.tar.xz.b64
          git add -A
          git commit -m "Publish TOPIUM USB INTRO v0.2.0 source" || exit 0
          git push origin HEAD:main
