name: Test and build Windows application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[build,test]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Check CLI
        run: python -m topium_usb_intro --version
      - name: Compile executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TOPIUM-USB-INTRO --collect-data topium_usb_intro --collect-all wmi --hidden-import pythoncom --hidden-import win32com.client scripts/launch.py
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOPIUM-USB-INTRO-Windows
          path: dist/TOPIUM-USB-INTRO.exe
          if-no-files-found: error
